<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="flyout.css" />
  </head>
  <body>
    <div id="pill">
      <div id="header">
        <span id="dot" class="dot idle"></span>
        <span id="label">VLAW</span>
        <span id="more-badge" class="hidden"></span>
      </div>
      <div id="alert-body" class="hidden">
        <div id="alert-title"></div>
        <div class="field-row"><span class="field-label">Agent</span><span id="field-agent" class="field-value"></span></div>
        <div class="field-row"><span class="field-label">Action</span><span id="field-action" class="field-value"></span></div>
        <div class="field-row"><span class="field-label">Target</span><span id="field-target" class="field-value"></span></div>
        <div id="buttons">
          <div class="btn-col">
            <button id="btn-allow" class="btn btn-allow">Allow</button>
          </div>
          <div class="btn-col">
            <button id="btn-investigate" class="btn btn-investigate">Investigate</button>
            <span class="btn-subtitle">View all alerts</span>
          </div>
          <div class="btn-col">
            <button id="btn-block" class="btn btn-block">BLOCK</button>
          </div>
        </div>
      </div>
    </div>
    <script src="flyout.js"></script>
  </body>
</html>
