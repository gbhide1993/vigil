services:
  vlaw:
    build: ./backend
    ports:
      # Published on the host's loopback only. The Vigil API has NO authentication, and inside the
      # container the server listens on all interfaces (backend/Dockerfile), so this mapping is what
      # keeps it off the network. Do not change it to "7422:7422" or expose it any other way.
      - "127.0.0.1:7422:7422"
    volumes:
      - ./data:/app/data          # SQLite DB
      - ./policy:/app/policy      # policy file
      - /:/host:ro                # host filesystem READ-ONLY
      - /proc:/host/proc:ro       # process info
    environment:
      # Explicit, on purpose: inside the container the server must listen on all interfaces for the published
      # port to reach it. The port mapping above (127.0.0.1 only) is what keeps it off the network.
      - VLAW_HOST=0.0.0.0
      - VLAW_HOST_ROOT=/host
      - VLAW_POLICY_FILE=/app/policy/vlaw-policy.json
      - VLAW_DATA_DIR=/app/data
    restart: unless-stopped

  vlaw-frontend:
    build: ./frontend
    ports:
      - "7423:80"
    depends_on:
      - vlaw
